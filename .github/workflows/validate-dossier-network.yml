name: Validate dossier network

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build public branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch dossier-seo-network https://github.com/Esmeevanleeuwen/aegis.git app
          cd app
          node --version
          npm --version
          npm ci
          npm run build
